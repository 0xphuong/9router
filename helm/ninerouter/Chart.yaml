apiVersion: v2
name: ninerouter
description: >-
  9Router — a self-hosted LLM API router — with its optional Headroom
  token-saver sidecar. 9Router runs as a StatefulSet because it keeps state in
  a local SQLite database; Headroom is stateless and runs as a Deployment.
type: application

# Chart version. Bump on every chart change.
version: 0.2.0

# Default 9Router image tag. Bare SemVer with no leading "v".
appVersion: "0.5.55"

keywords:
  - llm
  - proxy
  - router
  - ai

home: https://github.com/0xphuong/9router
sources:
  - https://github.com/0xphuong/9router
  - https://hub.docker.com/r/decolua/9router

maintainers:
  - name: 0xphuong
    email: me@binhphuong.io.vn

annotations:
  category: AI
