apiVersion: v1
kind: Service
metadata:
  name: {{ include "ninerouter.fullname" . }}
  labels:
    {{- include "ninerouter.ninerouter.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.ninerouter.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ninerouter.service.type }}
  ports:
    - port: {{ .Values.ninerouter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ninerouter.ninerouter.selectorLabels" . | nindent 4 }}
---
# Required by the StatefulSet's spec.serviceName. It gives the pod a stable DNS
# name; the ClusterIP Service above is what carries traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ninerouter.headless.name" . }}
  labels:
    {{- include "ninerouter.ninerouter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  # The pod should get its DNS record before it passes its readiness probe,
  # otherwise nothing can reach it to make it ready.
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.ninerouter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ninerouter.ninerouter.selectorLabels" . | nindent 4 }}
