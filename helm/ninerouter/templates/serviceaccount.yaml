{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ninerouter.serviceAccountName" . }}
  labels:
    {{- include "ninerouter.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload talks to the Kubernetes API.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
