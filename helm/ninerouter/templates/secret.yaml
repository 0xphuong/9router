{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ninerouter.secretName" . }}
  labels:
    {{- include "ninerouter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  INITIAL_PASSWORD: {{ .Values.auth.initialPassword | quote }}
  {{- with .Values.auth.apiKeySecret }}
  API_KEY_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.machineIdSalt }}
  MACHINE_ID_SALT: {{ . | quote }}
  {{- end }}
{{- end }}
