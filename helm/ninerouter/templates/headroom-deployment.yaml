{{- if .Values.headroom.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ninerouter.headroom.name" . }}
  labels:
    {{- include "ninerouter.headroom.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # A Deployment because Headroom holds no durable state — it is a proxy in
  # front of the upstream providers and any replica can serve any request.
  replicas: {{ .Values.headroom.replicaCount }}
  selector:
    matchLabels:
      {{- include "ninerouter.headroom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ninerouter.headroom.selectorLabels" . | nindent 8 }}
        {{- with .Values.headroom.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.headroom.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ninerouter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.headroom.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: headroom
          image: "{{ .Values.headroom.image.repository }}:{{ .Values.headroom.image.tag }}"
          imagePullPolicy: {{ .Values.headroom.image.pullPolicy }}
          {{- with .Values.headroom.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.headroom.containerPort }}
              protocol: TCP
          {{- with .Values.headroom.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.headroom.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.headroom.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.headroom.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.headroom.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.headroom.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
