---
- name: Check whether the Docker daemon is reachable
  ansible.builtin.command: docker info
  register: _docker_engine_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [docker, ninerouter]

- name: Install and configure Docker CE
  when:
    - docker_engine_install | bool
    - _docker_engine_probe.rc != 0
  tags: [docker]
  block:
    - name: Install Docker on Debian family
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: Install repository prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Ensure the keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add the Docker GPG key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add the Docker repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
              {{ ansible_facts['distribution_release'] }} stable
            filename: docker
            state: present

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
            state: present
            update_cache: true

    - name: Install Docker on the RedHat family
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Add the Docker repository
          ansible.builtin.yum_repository:
            name: docker-ce-stable
            description: Docker CE Stable
            baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
            gpgcheck: true
            gpgkey: https://download.docker.com/linux/centos/gpg
            enabled: true

        - name: Install Docker packages
          ansible.builtin.dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
            state: present

    - name: Fail on an unsupported OS family
      ansible.builtin.fail:
        msg: >-
          docker_engine only automates Debian and RedHat family hosts, but this
          host is {{ ansible_facts['os_family'] }} and its Docker daemon did not
          answer. Install Docker yourself, then re-run with
          docker_engine_install=false.
      when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

# Only after we installed it. A host whose daemon already answered the probe is
# left alone — it may be Docker Desktop, rootless, or a socket-activated unit
# with no "docker" service to manage.
- name: Ensure the Docker service is running
  ansible.builtin.service:
    name: docker
    state: "{{ docker_engine_service_state }}"
    enabled: "{{ docker_engine_service_enabled }}"
  when:
    - docker_engine_install | bool
    - _docker_engine_probe.rc != 0
  tags: [docker]

# community.docker talks to the daemon from the target host, so the library has
# to be present there rather than on the control node. Restricted to the package
# managers we know the naming scheme for.
- name: Install the Python libraries the docker modules need
  ansible.builtin.package:
    name: "{{ docker_engine_python_packages | map('regex_replace', '^', 'python3-') | list }}"
    state: present
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  tags: [docker, ninerouter]

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_engine_users }}"
  tags: [docker]
